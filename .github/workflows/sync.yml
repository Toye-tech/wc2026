name: Sync Football Data & Buzz

on:
  schedule:
    # Every 3 hours. A full sync now takes several minutes (Supabase is in a
    # different region from GitHub's runners, so each DB write has real
    # network latency) — running every 30 minutes isn't necessary anyway
    # during the off-season when nothing's actively changing, and risks
    # overlapping runs if kept that frequent.
    - cron: '0 */3 * * *'
  workflow_dispatch:  # lets you also trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug — check DATABASE_URL is present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is NOT set or empty"
          else
            echo "DATABASE_URL is set, length: ${#DATABASE_URL} characters"
            echo "Starts with: ${DATABASE_URL:0:15}..."
          fi

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py migrate --noinput

      - name: Run football data sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          PYTHONUNBUFFERED: "1"
        run: python manage.py fetch_football_data

      - name: Run buzz news sync
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py fetch_buzz_news
